[workspace]
members = [
    "crates/kairo-core",
    "crates/kairo",
    "crates/kairo-daemon",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/itsmanan/kairo"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
